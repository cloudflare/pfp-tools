name: Publish to crates.io
permissions:
  contents: read
  id-token: write

on:
  push:
    tags:
      - "*.*.*"

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Verify tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_REF_NAME}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} is not reachable from origin/main. Refusing to publish." >&2
            exit 1
          fi

      - uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: Validate release version
        run: |
          semver='[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?'
          if [[ ! "${GITHUB_REF_NAME}" =~ ^${semver}$ ]]; then
            echo "Unsupported release tag: ${GITHUB_REF_NAME}" >&2
            exit 1
          fi

          mapfile -t versions < <(
            cargo metadata --locked --no-deps --format-version 1 |
              jq -r '.packages[] | select(.name == "pfp-headers" or .name == "pfp-verifier") | .version' |
              sort -u
          )
          if [[ ${#versions[@]} -ne 1 || "${versions[0]}" != "${GITHUB_REF_NAME}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package versions: ${versions[*]}" >&2
            exit 1
          fi

      - name: Publish pfp-headers
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked -p pfp-headers

      - name: Publish pfp-verifier
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          for attempt in {1..12}; do
            if cargo publish --locked -p pfp-verifier; then
              exit 0
            fi

            if [[ ${attempt} -eq 12 ]]; then
              echo "Failed to publish pfp-verifier after waiting for pfp-headers to be indexed" >&2
              exit 1
            fi

            sleep 10
          done
